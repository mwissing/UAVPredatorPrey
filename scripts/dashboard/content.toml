[[chapter]]
title = "Pillars and perception"
dates = "8 October 2026 → now"
intro = "Pillars create corners and cover. The question is no longer only who wins, but whether each drone actually uses what it sees, tested by zeroing its obstacle branch."

[[chapter.stage]]
id = "pillars"
title = "Four pillars, first training"
dates = "2026-10-08"
verdict = "partial"
takeaway = "Crashes fell, but ablation showed the gains were blind. Only the prey used its pillar branch, and only to evade."
metric = "crash hazard −37 % · blind"
goal = "Add pillars (touching one is a crash) with zero-initialized obstacle branches, then learn to fly and fight among them."
result = """
- Obstacle-blind start: catch 0.107, predator crash 0.583, prey crash 0.485 per episode, episodes 2.2 s.
- After 15 000 joint updates: crash hazards −37 % / −35 %, catch 0.52. Per episode still 0.50 / 0.42 crashes.
- **Zeroing the obstacle branch does not raise crashes**: the gains were blind. The prey uses its branch only to *evade* among pillars ("weaving").
"""
why = """
The incentives barely paid for avoidance: for the prey a crash cost the same as being caught; for the predator one lost
drone cost a third of a catch (the team reward is a mean, only the catch bonus scales with team size).
Also: pillars parked 50 m away are out of distribution for the trained branch (prey OOB 0.90), so a presence mask is needed.
"""
experiment = "2026-10-08_obstacles_first_training"
evidence = ["artifacts/isaac/experiments/2026-10-08_obstacles_first_training/"]
[[chapter.stage.video]]
path = "isaac/experiments/2026-10-08_obstacles_first_training/videos/start/rl-video-step-0.mp4"
label = "start: anchor v3, obstacle-blind"
[[chapter.stage.video]]
path = "isaac/experiments/2026-10-08_obstacles_first_training/videos/final/rl-video-step-0.mp4"
label = "after 15 000 joint updates"

[[chapter.stage]]
id = "run-t"
title = "Crash price plus exploration (run T)"
dates = "2026-10-08 evening"
verdict = "partial"
takeaway = "The predator learned perception-based avoidance. The prey found a blind shortcut: it simply slowed down."
metric = "ablation +42 % (predator)"
goal = "Make crashes expensive (predator −600 per drone, prey −600) and give the predator more exploration (log-std floor −1.0)."
result = """
- Predator: crash hazard 0.57 × the control at equal catch; zeroing its branch raises crashes +42 % → **first perception-based avoidance**. Pursuit improved too (lead index 0.395).
- Prey: crash hazard 0.42 ×, but caught 2.9 × faster: it halved its speed and left the pillar zone (**blind** "slow and safe").
- Prey dose-response −200 / −350 / −600: a pure speed dial (4.5 / 3.8 / 3.2 m/s), branch unused.
"""
why = """
A price teaches perception only where **no blind shortcut** exists. The prey could simply slow down; the predator could
not, because slowing down costs catches. Adopted the predator settings, not the prey's.
"""
experiment = "2026-10-08_obstacles_crash_price_exploration"
evidence = ["artifacts/isaac/experiments/2026-10-08_obstacles_crash_price_exploration/"]
