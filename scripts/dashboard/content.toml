id = "run-t"
title = "Crash price plus exploration (run T)"
dates = "2026-10-08 evening"
verdict = "partial"
takeaway = "The predator learned perception-based avoidance. The prey found a blind shortcut: it simply slowed down."
metric = "ablation +42 % (predator)"
goal = "Make crashes expensive (predator −600 per drone, prey −600) and give the predator more exploration (log-std floor −1.0)."
result = """
- Predator: crash hazard 0.57 × the control at equal catch; zeroing its branch raises crashes +42 % → **first perception-based avoidance**. Pursuit improved too (lead index 0.395).
- Prey: crash hazard 0.42 ×, but caught 2.9 × faster: it halved its speed and left the pillar zone (**blind** "slow and safe").
- Prey dose-response −200 / −350 / −600: a pure speed dial (4.5 / 3.8 / 3.2 m/s), branch unused.
"""
why = """
A price teaches perception only where **no blind shortcut** exists. The prey could simply slow down; the predator could
not, because slowing down costs catches. Adopted the predator settings, not the prey's.
"""
experiment = "2026-10-08_obstacles_crash_price_exploration"
