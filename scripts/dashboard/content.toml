[[chapter.stage]]
id = "ghosts"
title = "Prey skill stage against scripted ghost pursuers (v1 → v3)"
dates = "2026-10-09"
verdict = "partial"
takeaway = "The prey learned to see pillars only when evasion was easy: slow ghosts plus a pillar-free belt."
metric = "ablation ratio 2.08 → 0.99"
goal = "Learn the flying skill first, then the game: train the prey alone against kinematic lead-pursuit ghosts that never crash and fly through pillars."
result = """
- v1 (ghosts 3.5 m/s): all four criteria passed, ablation ratio **2.08**, 5.2 m/s. But the prey increasingly circled the pillar-free outer belt.
- v2 (pillars up to the wall, ghosts 3.5–6.5 m/s): excellent evader (catch hazard 0.054/s, 5.5 m/s) but no perception (ratio 0.99).
- v3 (prey crash −300): fewer crashes against ghosts (−38 %), still no perception (ratio 1.05).
- Correction: without the belt, v1's prey crashes 2 × as often and its ratio drops to 1.28; much of v1's safety came from the belt.
"""
why = """
Under fast ghosts the prey escapes at speed and accepts crashes, because a crash costs about as much as being caught.
Perception appeared only when evasion was easy, which suggests a curriculum from easy to hard evasion.
"""
experiment = "2026-10-09_prey_ghost_skill_stage"
evidence = ["artifacts/isaac/experiments/2026-10-09_prey_ghost_skill_stage/", "artifacts/isaac/experiments/2026-10-09_prey_ghost_stage_v2/", "artifacts/isaac/experiments/2026-10-09_prey_ghost_stage_v3_crash_price/"]
