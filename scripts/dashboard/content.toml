[[chapter]]
title = "Back to a strong, reproducible pair"
dates = "4 → 8 October 2026"
intro = "Find what broke, restore the recipe that worked, stop self-play from forgetting old opponents, and measure before tuning."

[[chapter.stage]]
id = "diagnosis"
title = "Diagnose the July 19 drop, return to the archived recipe"
dates = "2026-10-04"
verdict = "worked"
takeaway = "A paired 2 × 2 role swap pinned the drop on the prey alone. The fix was restoring the recipe, not new ideas."
metric = "prey effect 0.34 · predator 0.004"
goal = "Find out why the catch rate collapsed after the July 19 joint update, and get back to a pair where both roles behave well."
result = """
- Paired 2 × 2 role swap (256 eps): prey effect 0.34, predator effect 0.004, so the prey alone caused the drop.
- Against 5 reference prey: scratch-lineage predator 0.098 vs Windows anchor 0.854.
- An archived-recipe smoke reproduced the July 12 smoke **bit-exactly**.
"""
why = """
The Linux scratch lineage had drifted from the recipe that produced the Windows anchor (LR 5e-5 instead of 1e-5,
AMP instead of FP32, log-std floor −3 instead of −2, short 1000-update phases, a 6 m/s speed margin in the reward).
Fix: restore FP32, LR 1e-5, floor −2, KL 0.05, the legacy reward, plus a catch-rate band guard.
"""
evidence = ["artifacts/isaac/diagnostics/2026-10-04_phase5_role_swap_and_windows_reference/"]

[[chapter.stage]]
id = "long-run"
title = "Archived-recipe long run"
dates = "2026-10-05 → 10-06"
verdict = "partial"
takeaway = "Strong in its own games, but self-play forgot how to beat old opponents."
metric = "reference mean 0.596"
goal = "Train a new pair with the restored recipe (prey → predator → prey phases, then joint phases)."
result = """
- Part 1 phases: catch 0.285 / 0.621 / 0.432. Part 2 (8 joint phases): catch 0.49–0.60, OOB ≤ 1 %.
- But the predator's reference mean fell to 0.596 (Windows anchor 0.854).
"""
why = """
**Forgetting.** PFSP pushed beaten prey to the weight floor, top-4 truncation then dropped them from the pool, and
pool weights were only refreshed after single-role phases. The predator stopped seeing old prey and lost to them.
"""
evidence = ["artifacts/isaac/curriculum/2026-10-05_18-25-59_3v1_pool_hysteresis_archived_recipe_part2/", "artifacts/isaac/diagnostics/reference_matrix/"]
