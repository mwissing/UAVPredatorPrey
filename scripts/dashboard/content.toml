[[chapter.stage]]
id = "dance-levers"
title = "Coordination levers in the dance: longer horizon, imposed roles, control"
dates = "2026-10-20"
verdict = "partial"
takeaway = "The longer horizon helps once the predators can see the shield (outcome +15.5 over the control, a third fewer drone losses); imposed role vectors are ignored. Pincers stay rare."
metric = "H: time-outs 0.064 vs 0.086"
goal = "Against the frozen symmetric prey, three predator-only arms from the same start (9600 updates each): discount 0.995 (H), random role vectors at norm 10 (R), and a control (C)."
result = """
- H: time-outs **0.064**, outcome return **133.4**, 0.105 drones lost per episode; the control: 0.086, 117.9, 0.163. Pre-registered: "partly" (time-outs 26 % below the control, bar 30 %).
- R: the role vectors kept their size, but the drones behave index-blind again (lead spread 0.077 → 0.010); the result equals the control.
- More training alone also gains against this frozen prey (time-outs 0.126 → 0.086), which is why every lever is measured against the control.
- Pincers stay at 13–16 % in every arm.
"""
why = """
At a 4 s horizon a lost drone costs twice as much future catch chance as at 2 s, so the critic values a safe, sustained
approach: the gain is mostly safety. The γ test of 2026-10-12 did nothing because the predators could not represent the
shield then. With one shared policy and a team reward, the learning signal keeps the team symmetric even when it starts
with identities, so coordination needs levers that act on credit rather than identity.
"""
experiment = "2026-10-20_dance_coordination_test"
evidence = ["artifacts/isaac/experiments/2026-10-20_dance_coordination_test/"]

