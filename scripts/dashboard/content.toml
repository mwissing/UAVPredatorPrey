[[chapter.stage]]
id = "overnight"
title = "Overnight self-play with ghost rehearsal"
dates = "2026-10-09 → 10-10"
verdict = "partial"
takeaway = "Self-play kept and sharpened the predator's perception, and erased the prey's within one cycle."
metric = "ablation ratio 1.41 vs 0.71"
goal = "Do both perception skills survive co-training? Six cycles of 2400 joint updates plus 600 prey updates against ghosts (rehearsal), pillars up to the wall, from the run-T predator and v1's ghost-trained prey."
result = """
- Own matchup: catch 0.16 → 0.49; predator crash hazard 0.173 → 0.085/s; prey 0.307 → 0.223/s.
- Predator: ablation ratio 1.08 → **1.41** against the start prey (+52 % crashes without its branch in its own matchup); lead index 0.06 → 0.27, wall enclosure 0.10 → 0.17.
- Prey: ratio 1.28 → 1.00 → **0.71**; it weaves among pillars again (77 % of its time in the pillar zone).
- Pre-registered verdict: criterion 1 (perception in both roles) fails; speed and balance pass.
"""
why = """
In self-play the prey's incentives favor evasion over safety, even with a crash costing 1.5 × a catch, and fast-ghost
rehearsal did not protect the skill. The predator has no blind shortcut: slowing down costs catches.
"""
experiment = "2026-10-09_overnight_selfplay_ghost_rehearsal"
evidence = ["artifacts/isaac/experiments/2026-10-09_overnight_selfplay_ghost_rehearsal/"]
