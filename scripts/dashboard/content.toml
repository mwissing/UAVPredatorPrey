[[chapter.stage]]
id = "pillar-only"
title = "Pillar-only graft: do fewer crashes alone break the waiting game?"
dates = "2026-10-19"
verdict = "partial"
takeaway = "Only in part: seeing all pillars cuts crashes and lifts the outcome a little, but the waiting game breaks only when the actor sees where the prey is relative to the pillars."
metric = "time-outs 0.033 (full graft 0.008)"
goal = "Separate the two things the relation branch gives the predators: all-pillar perception (fewer crashes) and the pillar-prey relation. Arm n zeroes the prey-dependent token features; everything else as the full graft (seed 70, 19,200 updates)."
result = """
- Pillar-crash rate 0.217 (full graft 0.173, no graft 0.268); outcome return 122.9 (143.2 / 112.7); time-outs **0.033** (0.008 / 0.047).
- The curve levels off at about 123, where the full graft kept climbing to 143.
- Its branch zeroed: −15.5 points, crashes up, time-outs unchanged (the full branch zeroed: −67).
- The critic had the full relation branch and values the long game (explained variance 0.20 in long episodes), yet the waiting game stayed.
"""
why = """
The hypothesis was that fewer crashes are what break the waiting game. They help, with about a third of the gain,
but the actor also needs the prey-relative tokens: the prey's offset, the prey relative to each pillar, and whether a
pillar blocks the line to the prey. A critic that knows the long game does not make up for an actor that cannot see it.
"""
experiment = "2026-10-19_relation_graft_pillar_only"
evidence = ["artifacts/isaac/experiments/2026-10-19_relation_graft_pillar_only/"]

