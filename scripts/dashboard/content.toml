# Curated story for the dashboard (scripts/dashboard/dashboard.py).
#
# Everything about experiments, live runs, eval curves and videos is generated from the evidence on every page load
# (docs/experiment_log.md, artifacts/isaac/experiments/*, eval JSONs, console logs) and cannot go stale. This file
# holds only what needs judgment: the pitch, milestone numbers, the stage story, featured charts and videos, lessons,
# the reproduction recipe and next steps. Update it when a milestone changes.
#
# Text fields are markdown. Video and data paths are relative to artifacts/; evidence paths start with artifacts/
# (served, so they become links) or UAVPredatorPrey/. Numbers are copied from docs/experiment_log.md and the
# RESULTS.md files. Unless stated otherwise: deterministic evaluation, 1024 episodes, seed 42; catch rate = predator
# success; "u" = MAPPO updates (24 env steps each).

# =========================================================================================== hero

[hero]
eyebrow = "Multi-agent RL · quadrotors · Isaac Lab"
title = "Three drones learn to hunt one"
pitch = """
Three predator quadrotors learn to catch a more agile prey drone while the prey learns to escape: two teams of
neural-network policies that train against each other in physics simulation. Since stage 8 they fly among pillars,
where a touch is a crash. Since 7 October every change is a pre-registered experiment with a decision rule, an
ablation and a bit-reproducible evaluation.
"""
