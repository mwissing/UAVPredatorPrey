[[chapter]]
title = "Back to a strong, reproducible pair"
dates = "4 → 8 October 2026"
intro = "Find what broke, restore the recipe that worked, stop self-play from forgetting old opponents, and measure before tuning."

[[chapter.stage]]
id = "diagnosis"
title = "Diagnose the July 19 drop, return to the archived recipe"
dates = "2026-10-04"
verdict = "worked"
takeaway = "A paired 2 × 2 role swap pinned the drop on the prey alone. The fix was restoring the recipe, not new ideas."
metric = "prey effect 0.34 · predator 0.004"
goal = "Find out why the catch rate collapsed after the July 19 joint update, and get back to a pair where both roles behave well."
result = """
- Paired 2 × 2 role swap (256 eps): prey effect 0.34, predator effect 0.004, so the prey alone caused the drop.
- Against 5 reference prey: scratch-lineage predator 0.098 vs Windows anchor 0.854.
- An archived-recipe smoke reproduced the July 12 smoke **bit-exactly**.
"""
why = """
The Linux scratch lineage had drifted from the recipe that produced the Windows anchor (LR 5e-5 instead of 1e-5,
AMP instead of FP32, log-std floor −3 instead of −2, short 1000-update phases, a 6 m/s speed margin in the reward).
Fix: restore FP32, LR 1e-5, floor −2, KL 0.05, the legacy reward, plus a catch-rate band guard.
"""
evidence = ["artifacts/isaac/diagnostics/2026-10-04_phase5_role_swap_and_windows_reference/"]

[[chapter.stage]]
id = "long-run"
title = "Archived-recipe long run"
dates = "2026-10-05 → 10-06"
verdict = "partial"
takeaway = "Strong in its own games, but self-play forgot how to beat old opponents."
metric = "reference mean 0.596"
goal = "Train a new pair with the restored recipe (prey → predator → prey phases, then joint phases)."
result = """
- Part 1 phases: catch 0.285 / 0.621 / 0.432. Part 2 (8 joint phases): catch 0.49–0.60, OOB ≤ 1 %.
- But the predator's reference mean fell to 0.596 (Windows anchor 0.854).
"""
why = """
**Forgetting.** PFSP pushed beaten prey to the weight floor, top-4 truncation then dropped them from the pool, and
pool weights were only refreshed after single-role phases. The predator stopped seeing old prey and lost to them.
"""
evidence = ["artifacts/isaac/curriculum/2026-10-05_18-25-59_3v1_pool_hysteresis_archived_recipe_part2/", "artifacts/isaac/diagnostics/reference_matrix/"]
[[chapter.stage.video]]
path = "isaac/curriculum/2026-10-05_18-25-59_3v1_pool_hysteresis_archived_recipe_part2/videos/phase_008_after/rl-video-step-0.mp4"
label = "after the 8th joint phase"

[[chapter.stage]]
id = "anchor-v2"
title = "Rehearsal pool and toward_center scheduler → anchor v2"
dates = "2026-10-06"
verdict = "worked"
takeaway = "Keeping old opponents in training undid the forgetting: the self-play analogue of a replay buffer."
metric = "reference mean 0.596 → 0.873"
goal = "Undo the forgetting without losing strength against the current prey."
result = """
- Rehearsal (75 % pool of all 5 reference prey): reference mean 0.596 → 0.828, but own matchup 0.535 → 0.402 (trade-off).
- `toward_center` scheduler (no joint phases; train the role below the band center), 6 × 1200 u: reference mean **0.873** (Windows anchor 0.854). Frozen as anchor v2.
"""
why = "Old opponents must stay in the training distribution; a rehearsal share is the multi-agent analogue of a replay buffer against catastrophic forgetting."
experiment = "2026-10-06_predator_rehearsal_pool"
evidence = ["artifacts/isaac/experiments/2026-10-06_predator_rehearsal_pool/", "UAVPredatorPrey/docs/anchor_v2_2026-10-06.md"]
[[chapter.stage.video]]
path = "isaac/experiments/2026-10-06_predator_rehearsal_pool/videos/rehearsed_predator_vs_Y8/rl-video-step-0.mp4"
label = "rehearsed predator vs its own prey (Y8)"

[[chapter.stage]]
id = "measure"
title = "Measure before tuning"
dates = "2026-10-07"
verdict = "worked"
takeaway = "League, horizon test, bootstrapping A/B, normalizer check and a seed noise floor, before any more tuning."
metric = "seed noise SD 0.027"
goal = "Know what the game and the training actually look like before changing anything else."
result = """
- League (9 × 9, Bradley–Terry): anchor v2 strongest in both roles; the game is strongly **non-transitive**.
- Horizon: catch 0.486 / 0.724 / 0.854 at 10 / 20 / 30 s, constant hazard ≈ 0.06/s → policies are length-independent.
- Time-limit bootstrapping A/B: equal in the own matchup, better beyond the training horizon, critic EV no longer collapses (0.93 → 0.21 without). **Adopted as default.**
- Value normalizer is stale (targets squashed 300× / 20×) but EV stays 0.72–0.87 → not a bottleneck, left alone.
- Seed noise floor: SD 0.027 own matchup, 0.003 reference mean → A/B margins ≥ 0.08 or 3 seeds.
"""
why = """
A time-out is truncation, not termination: treating it as terminal makes the value target depend on a clock the policy
cannot see (no time-to-go by design). Bootstrapping with γV(s′) removes that inconsistency. The noise floor tells which
earlier "wins" were real.
"""
experiment = "2026-10-07_time_limit_bootstrap_ab"
evidence = ["artifacts/isaac/diagnostics/league_2026-10-07/", "artifacts/isaac/experiments/2026-10-07_time_limit_bootstrap_ab/", "artifacts/isaac/experiments/2026-10-07_value_normalizer_calibration/", "artifacts/isaac/experiments/2026-10-07_training_seed_noise/"]

[[chapter.stage]]
id = "coordination"
title = "Three levers for predator coordination"
dates = "2026-10-07"
verdict = "failed"
takeaway = "Shaping, exploration and prey agility did not make the predators corner the prey. In 3-D, only the arena wall offers a corner."
metric = "wall enclosure 0.193 → 0.156"
goal = "Get the three predators to corner the prey (cut-off, enclosure) instead of chasing as a pack from one side."
result = """
- Removing pursuit shaping: no change in geometry (kept at 2.0).
- Wider predator log-std floor (−1.5): faster specialization, held-out mean 0.787 → 0.719, same strategy.
- More agile prey (T/W 2.5): the predator learned **better individual interception** (lead index 0.13 → 0.23), but wall enclosure before catches *fell* (0.193 → 0.156).
"""
why = """
Three drones cannot surround a prey in free 3-D space; the only surface to corner it against is the arena sphere,
and the prey lives near it. None of the levers changed that geometry, so the next step was **obstacles**, which
create corners. Lesson: the right strategy metric (wall-plane enclosure) matters more than the lever.
"""
experiment = "2026-10-07_prey_agility_curriculum"
evidence = ["artifacts/isaac/experiments/2026-10-07_predator_progress_shaping_ab/", "artifacts/isaac/experiments/2026-10-07_predator_exploration_floor/", "artifacts/isaac/experiments/2026-10-07_prey_agility_curriculum/"]

[[chapter.stage]]
id = "anchor-v3"
title = "Anchor v3: rehearsal pool 60 %, overnight"
dates = "2026-10-07 → 10-08"
verdict = "worked"
takeaway = "A moderate rehearsal share gave the strongest pair in both roles without forgetting."
metric = "league #1, both roles"
goal = "A stronger reference pair without forgetting, as the starting point for obstacles."
result = """
- toward_center 12 × 1200 u (9 predator, 3 prey phases). Predator vs start prey 0.367 → 0.562, held-out 0.691 → 0.812, reference mean 0.869 (guardrail held).
- League 10 × 10: anchor v3 strongest in both roles (predator +1.13, prey +1.09 logits).
- Coordination still absent (wall enclosure 0.112).
"""
why = "A moderate rehearsal share balances plasticity against retention: the pre-test with 75 % removed forgetting but cost 0.16 against the current opponent."
experiment = "2026-10-07_anchor_v3_overnight"
