[[chapter.stage]]
id = "amp"
title = "AMP takeover runs from the Windows anchor"
dates = "2026-07-15 → 07-17"
verdict = "open"
takeaway = "Throughput probes from the anchor. Undocumented; mixed precision was later dropped from the recipe."
metric = "catch 0.51–0.60"
goal = "Throughput probes (AMP vs FP32) and short joint phases from the anchor."
result = "Catch stayed between 0.51 and 0.60 (ended 0.582, 256 eps). No write-up exists."
why = "Listed for completeness. AMP was later dropped from the reference recipe."
