[[chapter.stage]]
id = "from-scratch-seed81"
title = "Stage 8b: anchor v5's configuration from random init (seed 81)"
dates = "2026-10-22 → 10-23"
verdict = "failed"
takeaway = "One script trained a pair from random init among the ten pillars: a strong prey, but predators that settle into a standoff paid by the upright reward. The gate failed on balance, the duel with anchor v5 and the waiting-game mechanism."
metric = "own catch 0.033 · duel with v5 −32 · time-outs 0.94"
goal = "Train the anchor v5 configuration from scratch with one resumable script: flight among the pillars, an LR pilot, the game with a catch-rate band guard, anchor v5's consolidation; gate = v5's criteria plus a duel with v5 (seed 81 of 3)."
result = """
- Flight passed after 4500 updates (drones lost 0.001). The pilot chose LR 1e-4; the 1e-5 arm scored higher but lost 0.83 drones per episode, which the guard could not flag (a gap in the rule).
- Game: the band guard ran 14 of 18 blocks predator-only. The predators learned each frozen prey (catch up to 0.82), and the prey escaped again in every joint or prey block.
- End (C point 5): own catch 0.033, time-outs 0.94, predators 3.1 m away at 1.4–2.8 m/s; the prey orbits its pillar 48 % of the time.
- The prey is strong: anchor v5's predators earn 52 against it, against 130 against v5's own prey. Our predators earn 16 against v5's prey.
- The from-scratch networks encode the closing speed far better than the graft lineage (GRU probe 0.66 vs 0.39), and their attention is soft instead of one-hot.
"""
why = """
The predators' value is the upright stream: about 18 return at discount 0.995, the critic's standoff value (17.7). A
catch is worth more, but it is out of reach against a prey that is more agile (thrust-to-weight 2.2 vs 1.9), has 5×
stronger distance shaping and gets a ghost curriculum. So waiting at a safe distance became the predators' best
response, and their pursuit decayed: interception of a hovering prey fell from 0.99 to 0.07. That is item 6 (B7) of
the Stage 8 review; the lineage never met it because it started from the Windows anchor's strong predator.
"""
experiment = "2026-10-22_stage8b_from_scratch"
