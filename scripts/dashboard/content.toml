[[chapter]]
title = "The waiting game"
dates = "12 October 2026 → now"
intro = "The prey learned to hide behind a pillar and wait out the clock. Changes to incentives, horizon and noise did not break it. Probing the trained networks showed that the predators could not represent the situation, and a new perception branch then broke it."

[[chapter.stage]]
id = "waiting-incentives"
title = "Predator stages against the waiting prey: horizon, shaping, shield starts, crash cost"
dates = "2026-10-12 → 10-15"
verdict = "failed"
takeaway = "Six predator stages made the predators safer, not better at the end game. Only a cheaper crash moved the outcome."
metric = "time-outs 0.070 → 0.040"
goal = "Teach the predators to catch a prey that circles a pillar until the time-out: the predators train alone against the frozen waiting prey, 9600 updates per stage."
result = """
- The waiting prey: in the 14 % of episodes that last 5 s or more, the predators fly at 1.1 m/s about 6.6 m away, and half of those episodes end by time-out.
- Horizon γ 0.99 / 0.995 / 0.998 (about 2 / 4 / 10 s): no effect on the long game, a dose-response null.
- No distance-progress shaping: no effect. The prey circles its shield pillar; two predators flank it in only 1–2 % of frames.
- Shield starts (an end-game curriculum of start states): shield-start catch 0.326 → 0.306, pincers unchanged.
- Crash-cost curriculum (−300 per drone): catch 0.661 → 0.729, but more crashes and the same long game. The predator default became −400 (next stage: time-outs 0.040, catch 0.72).
"""
why = """
In every stage the long episodes looked the same: the line to the prey blocked 53–56 % of the time, closing speed
about 0 at 6.3–6.7 m, and 70–84 % of the predators' losses with the line blocked. They pursued only directly, never
around a pillar. The cause was not the incentives (see the diagnostics below).
"""
experiment = "2026-10-14_predator_crash_curriculum"
evidence = ["artifacts/isaac/experiments/2026-10-12_predator_stage_wall10/", "artifacts/isaac/experiments/2026-10-12_predator_stage_gamma995/", "artifacts/isaac/experiments/2026-10-13_predator_stage_noprogress/", "artifacts/isaac/experiments/2026-10-13_predator_stage_shield/", "artifacts/isaac/experiments/2026-10-14_predator_crash_curriculum/"]

