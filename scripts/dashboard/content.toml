intro = "Pillars create corners and cover. The question is no longer only who wins, but whether each drone actually uses what it sees, tested by zeroing its obstacle branch."

[[chapter.stage]]
id = "pillars"
title = "Four pillars, first training"
dates = "2026-10-08"
verdict = "partial"
takeaway = "Crashes fell, but ablation showed the gains were blind. Only the prey used its pillar branch, and only to evade."
metric = "crash hazard −37 % · blind"
goal = "Add pillars (touching one is a crash) with zero-initialized obstacle branches, then learn to fly and fight among them."
result = """
- Obstacle-blind start: catch 0.107, predator crash 0.583, prey crash 0.485 per episode, episodes 2.2 s.
- After 15 000 joint updates: crash hazards −37 % / −35 %, catch 0.52. Per episode still 0.50 / 0.42 crashes.
- **Zeroing the obstacle branch does not raise crashes**: the gains were blind. The prey uses its branch only to *evade* among pillars ("weaving").
"""
why = """
The incentives barely paid for avoidance: for the prey a crash cost the same as being caught; for the predator one lost
drone cost a third of a catch (the team reward is a mean, only the catch bonus scales with team size).
Also: pillars parked 50 m away are out of distribution for the trained branch (prey OOB 0.90), so a presence mask is needed.
"""
experiment = "2026-10-08_obstacles_first_training"
evidence = ["artifacts/isaac/experiments/2026-10-08_obstacles_first_training/"]
