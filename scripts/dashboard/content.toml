[[chapter.stage]]
id = "blind-spots"
title = "Stage 8 diagnostics: the predators cannot represent the shield"
dates = "2026-10-16 → 10-17"
verdict = "worked"
takeaway = "Probing the trained networks found what nine training runs had missed: the architecture cannot represent where the prey hides."
metric = "prey's pillar attended 0.4–0.7 %"
goal = "Find out why no intervention changed the long game, by recording and probing the networks (attention weights, critic values, features) in deterministic evaluations."
result = """
- The one-hot pillar attention, queried by the drone's own state, attends the prey's pillar in 0.4–0.7 % of standoff steps (chance 10 %).
- Prey and teammates share one softmax, so the prey is in a predator's attention context in only 45–49 % of steps.
- The critic cannot value the long game: explained variance −0.14 to 0.00 in long episodes (0.38–0.43 in short ones). The prey-pillar distance is barely in its features (R² 0.08–0.22).
- The line of sight to the prey is recoverable from the inputs (set encoder 0.83), but not from the attended pillar (0.57) or the GRU output (0.55).
- Relative positions are in the body frame, velocities in the world frame, the heading is not observed, and the drones yaw about 120 °/s.
- Credit: GAE runs inside 24-step rollouts. 96-step rollouts with λ 0.99 sharpened crash avoidance, but not the long game.
"""
why = "No incentive can teach a skill that the network cannot represent: representation first, then incentives. An external review was integrated and checked claim by claim."
experiment = "2026-10-17_predator_credit_horizon"
evidence = ["UAVPredatorPrey/docs/stage8_review_2026-10-17.md", "artifacts/isaac/diagnostics/2026-10-16_stage8_blind_spots/", "artifacts/isaac/experiments/2026-10-17_predator_credit_horizon/"]

[[chapter.stage]]
id = "relation-graft"
title = "Relation graft: the predators learn to see the pillar shield"
dates = "2026-10-17 → 10-18"
verdict = "worked"
takeaway = "Zero-initialized pillar-prey relation branches broke the waiting game against the frozen prey, at two seeds. A matched control trained just as long did not."
metric = "time-outs 0.047 → 0.008"
goal = "Give the trained predators the missing relations, and test whether that, rather than more training, breaks the waiting game."
result = """
- Actor branch: every pillar becomes a token with the prey (offsets, distances, distance to the drone → prey segment), max + mean pooled. Critic branch: one identity-aware token per pillar. Both zero-initialized, × 30 LR, bit-exact when off.
- 9600 updates (g5): the relations reach the encoder (line of sight 0.74) and the critic (prey-pillar R² 0.93), not yet the GRU; catch 0.754.
- 19,200 updates (c5): catch **0.840**, time-outs **0.008**, 0.25 drones lost per episode, outcome return **143.2**. The pre-registered policy probe missed narrowly (GRU line of sight 0.670, bar 0.70).
- Matched control k5 (no graft, the same 19,200 updates): catch 0.751, time-outs 0.047, outcome return 112.7, and its probes stay at the old level.
- Ablation: c5 with the relation branch zeroed falls to 76.2, below the control (pillar crashes 0.173 → 0.362); zeroing the old one-hot attention costs 4.4.
- Seed-71 replication (graft plus continuation): time-outs **0.020**, outcome return 137.2 vs 108.6 for seed 71 without the graft (gap +28.6; seed 70: +30.5). Its relation branch zeroed: 32.9.
"""
why = """
The branch shows each drone all pillars relative to itself and the prey, instead of one pillar picked by its own
state. The predators fly and hunt through it, and the old attention has become redundant. All of this is against
a prey that cannot adapt; the self-play below tests that.
"""
experiment = "2026-10-18_control_continuation"
evidence = ["artifacts/isaac/experiments/2026-10-17_predator_relation_graft/", "artifacts/isaac/experiments/2026-10-18_relation_graft_continuation/", "artifacts/isaac/experiments/2026-10-18_control_continuation/", "artifacts/isaac/diagnostics/2026-10-18_c5_branch_ablation/", "artifacts/isaac/experiments/2026-10-18_relation_graft_seed71/"]
