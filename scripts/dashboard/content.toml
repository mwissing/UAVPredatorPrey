[[chapter.stage]]
id = "masks"
title = "Two observation bugs: parked pillars and crashed-drone placeholders"
dates = "2026-10-10"
verdict = "worked"
takeaway = "Absent and dead entities need masks, not placeholders. Both bugs looked like learning failures."
metric = "exits after predator crashes 78 % → 1.6 %"
goal = "Find out why trained pairs leave the arena in open space, and why the prey flees after a predator crashes."
result = """
- Absent pillars were parked 50 m away, and trained obstacle branches reacted to those out-of-range features (open space: predator OOB 0.733, prey 0.725). A **presence mask** (72b877a) gives absent pillars no attention; the masked pair then equals the pair with the branch zeroed, bit-exactly.
- A crashed predator appeared in the prey's observation as a placeholder 10 m straight ahead with zero relative velocity (found by the user). Opt-in **crashed-drone masks** cut prey exits after a predator crash from 78 % to 1.6 % (v1 prey) and from 62 % to 0 % (start prey).
- Rescoring with the masks kept the perception conclusions, but crash hazards against crash-prone opponents had been biased low. From v6 on, every evaluation uses both masks.
"""
why = "A trained network extrapolates on inputs it never saw. A fixed placeholder or a far-away parking spot is such an input; a mask removes it from the computation."
experiment = "2026-10-10_crashed_predator_mask_check"
evidence = ["artifacts/isaac/experiments/2026-10-10_crashed_predator_mask_check/"]

[[chapter.stage]]
id = "prey-v5-v8"
title = "Prey perception among more pillars (ghost stages v5 → v8)"
dates = "2026-10-10 → 10-11"
verdict = "partial"
takeaway = "The crash price, not a bigger attention module, gave the prey perception in dense layouts. Its one-hot attention looked at pillars unrelated to danger."
metric = "C8: dense ratio 1.41 / 1.46"
goal = "Get the prey to avoid pillars by perception in dense layouts, against slow ghosts."
result = """
- v5 (v4 continued): a plateau, ablation ratio about 1.2 in the standard layout and 1.0 in the full layout.
- v6 (8 pillars): best prey on the 4-pillar yardstick (crash hazard 0.118/s, ratio 2.11), but no dense perception (1.20 / 1.06). An attention probe shows why: the prey's obstacle attention is one-hot and picks the later-hit pillar at chance level.
- v7 (a multi-head attention block, zero-initialized, × 30 LR): two heads find the pillar about to be hit (weight 0.49 / 0.39, chance 0.125), but training degraded (return −52.8 → −82.7) and the prey flew faster into the pillar zone.
- v8 (2 × 2, block × prey crash cost): the block hurts in both pairs, while a −300 crash cost strengthens perception (dense ratio 1.43 vs 0.97). **C8** (no block, −300) is the best prey: dense ratio 1.41 / 1.46, 4-pillar crash hazard 0.057/s, at the price of more catches.
"""
why = """
The bottleneck was architectural (one-hot attention that does not look at the danger), but a new module grafted onto
the trained prey at a high learning rate destabilized PPO. The working lever was the incentive: a crash that costs more
than being caught (now the default, −300 vs −200).
"""
experiment = "2026-10-10_prey_ghost_stage_v8_block_x_crash_cost"
