# =========================================================================================== journey

[[chapter]]
title = "Foundations"
dates = "March → July 2026"
intro = "Build the game, the policy architecture and a first strong pair on Windows, move to Linux, and try learning from scratch."

[[chapter.stage]]
id = "bringup"
title = "Environment and architecture, 1v1 → 3v1"
dates = "2026-03 → 06"
verdict = "worked"
takeaway = "A hysteresis curriculum keeps the game near 50/50, so both roles keep getting a learning signal."
metric = "1v1 → 3v1"
goal = "Build the task from the Isaac Lab drone template and grow the policy architecture with the number of agents."
result = """
- `1v1-empty-v0` → `3v1-empty-v0` with skrl MAPPO on MLPs, then a 1v1 **hysteresis curriculum** (catch-rate band 0.40/0.60 decides which role trains next).
- Architecture: shared-attention actor → teammate velocities (obs 90/30/120) → entity-attention critic → prey attention + random spawn → large GRU with recurrent MAPPO.
- Few numbers survive from this era; the Windows logs are not on Linux.
"""
why = """
A role that always wins or always loses has near-zero advantage variance, so it stops learning. Attention handles a
variable number of entities; the GRU lets the policy integrate opponent motion over time.
"""
evidence = ["UAVPredatorPrey/docs/1v1_hysteresis_curriculum_runbook.md", "UAVPredatorPrey/docs/curriculum_learning_plan.md", "UAVPredatorPrey/docs/marl_sota_roadmap.md"]

[[chapter.stage]]
id = "legacy-obstacles"
title = "Legacy obstacle curriculum"
dates = "2026-03-30 → 06-06"
verdict = "partial"
takeaway = "Catch rates stayed high and the prey never used obstacles as cover; a dead branch."
metric = "catch 0.92 → 0.78"
goal = "A first obstacle task (`3v1-obstacles-v0`, 4 obstacles in a ring) with a catch-distance curriculum 0.5 → 0.4 → 0.3 m."
result = """
Training-tail metrics: catch ≈ 0.92 / 0.86 / 0.78 at 0.5 / 0.4 / 0.3 m, predator OOB up to ≈ 0.15.
"The prey is still caught relatively quickly … does not yet actively use obstacles as cover."
"""
why = "A separate env class with an incompatible observation layout (84/34/118), superseded by the stage 8 pillars on the 3v1 anchor stack (inferred)."
evidence = ["UAVPredatorPrey/docs/training_3v1_obstacles.md"]

[[chapter.stage]]
id = "windows-anchor"
title = "Elevated arena, correctness audit, Windows anchor"
dates = "2026-07-02 → 07-11"
verdict = "worked"
takeaway = "Fixing evaluation bugs mattered as much as training: one GRU-state bug alone faked a 95 % failure rate."
metric = "catch 0.678"
goal = "Move the game into an elevated sphere (z = 6 m, r = 5 m, random spawn), fix correctness bugs, and train the reference pair."
result = """
- Correctness fixes: GRU hidden state was not carried in eval (prey OOB 0.955 → 0.012 once fixed), per-env balanced episode accounting, exact freezing of a frozen role, executed vs sampled action (tanh squash), one-time crash cost.
- Windows anchor `agent_115200`: catch **0.678** (512 eps). Recipe: LR 1e-5, KL 0.05, log-std floor −2, FP32, 4800-update phases, 50 % pool.
"""
why = "The root of every later reference. Its recipe (FP32, LR 1e-5, floor −2, long phases) is the one that later had to be restored."
evidence = ["UAVPredatorPrey/.pretrained_checkpoints/linux_migration_2026-07-11/", "UAVPredatorPrey/docs/linux_handoff_2026-07-11.md"]

[[chapter.stage]]
id = "linux"
title = "Linux migration (Docker) and a JAX simulator attempt"
dates = "2026-07-11 → 07-16"
verdict = "partial"
takeaway = "Docker reproduced the anchor exactly; the JAX port matched the network but not closed-loop play."
metric = "0.677734375, bit-exact"
goal = "Move to a pinned Linux container (Isaac Sim 5.1, Isaac Lab 2.3.2, skrl 1.4.3) and try a much faster JAX port."
result = """
- Docker parity: the anchor reproduced **0.677734375 exactly** at 512 eps, seed 42 (seeds 43–46: 0.656–0.703).
- JAX port: inference parity, but closed-loop catch 0.082 vs 0.678 in Isaac (predator OOB 0.816). Not used since.
"""
why = "Policy-level parity does not imply closed-loop parity: small dynamics differences compound over 500 steps of feedback. The JAX gap is a physics-fidelity problem, not a learning one."
evidence = ["artifacts/isaac/evaluations/", "UAVPredatorPreyJAX/README.md"]

[[chapter.stage]]
id = "flight"
title = "From scratch: learn to fly first, then chase"
dates = "2026-07-17 → 07-19"
verdict = "partial"
takeaway = "Flight has to come first, in the target arena. The chase stage on top drifted from the recipe and gave a weak predator."
metric = "predator OOB 1.0 → 0.004"
goal = "Rebuild a pair from random init without the Windows history: flight first (no competitive rewards), then the catch curriculum."
result = """
- Joint training on the target task from random init: catch 0, predator OOB **1.0**: the drones never learn to fly (v2).
- Flight bootstrap at z = 1 with ring spawn: perfect on its own task, predator OOB 1.0 on the elevated target (v3).
- **Two-stage flight** (v4): fixed spawn 750 u, then random spawn in the elevated arena 2000 u → on the target task predator OOB 0.004, episodes 494.6 of 500 steps. **Flying worked.**
- Chase stage afterwards (hysteresis, LR 5e-5, AMP, floor −3, short phases, uncommitted code): the prey reached Windows level, but the predator scored only **0.098** vs reference prey (Windows anchor 0.854).
"""
why = """
Competitive rewards on top of an unstable plant give no signal (every episode ends in a crash), so flight must come
first, and it must be learned in the target arena's state distribution (v3 failed to transfer from z = 1).
The weak predator came from recipe drift, not from the flight-first idea (diagnosed on 4 October).
"""
evidence = ["artifacts/isaac/lineages/2026-07-17_21-28-34_scratch_two_stage_flight_v4/", "artifacts/isaac/lineages/2026-07-17_20-43-59_scratch_flight_bootstrap_v3/"]
