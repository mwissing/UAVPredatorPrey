# =========================================================================================== lessons

[[lesson]]
verdict = "failed"
what = "A fixed pass bar as an equilibrium test."
why = "The league stopped when both roles passed a 0.5 bar within one block. The prey passed with 0.02–0.04 caught, and the predators' gate left out the latest prey, so the run stopped at 22 % of its budget while the two best responses were still 0.40 apart (0.449 against 0.047). Test equilibrium on the gap between the best responses, and put the latest opponent into every gate."
evidence = ["artifacts/isaac/experiments/2026-10-24_league_continuation_seed81/RESULTS.md"]

[[lesson]]
verdict = "worked"
what = "Train each role against the other's whole, deduplicated history (fictitious play)."
why = "Latest-vs-latest training made seed 81's predators forget: each version caught the prey it trained on, and the final one caught the 12 past prey at 0.08. Three league cycles lifted that to 0.53 and kept the pursuit of easy prey (interception 0.07 → 0.996). Deduplicate by weight hash: a frozen role's checkpoints are copies, and seed 81's pools were full of them."
evidence = ["artifacts/isaac/experiments/2026-10-24_league_continuation_seed81/RESULTS.md"]

[[lesson]]
verdict = "failed"
what = "Removing the living bonus to make the losing side press."
why = "Zero-at-level upright term against the dominant from-scratch prey: the predators moved more (closing speed 0.77 vs 0.05 m/s) but caught nothing (0.002 in both arms). A bonus can decide how a losing agent waits, not whether it can win: while catches are out of reach, pressing earns nothing and risks crashes."
evidence = ["artifacts/isaac/experiments/2026-10-23_upright_mechanism_test/RESULTS.md"]

[[lesson]]
verdict = "failed"
what = "A positive per-step bonus in a game the agent is losing."
why = "From scratch the prey got ahead, and the predators' value became the upright stream (≈ 18 at discount 0.995): hovering 3 m away paid more than pressing a prey they rarely caught, and their pursuit decayed (interception of a hovering prey 0.99 → 0.07). A living bonus that is harmless next to a reachable goal becomes the policy once the goal is out of reach."
evidence = ["artifacts/isaac/experiments/2026-10-22_stage8b_from_scratch/RESULTS.md"]

[[lesson]]
verdict = "worked"
what = "Learn to fly before learning to chase, in the target arena's state distribution."
why = "From random init, competitive rewards give no signal because every episode ends in a crash (predator OOB 1.0). Two-stage flight (fixed, then random spawn at z = 6) reached OOB 0.004."
evidence = ["artifacts/isaac/lineages/2026-07-17_21-28-34_scratch_two_stage_flight_v4/"]

[[lesson]]
verdict = "failed"
what = "A flight bootstrap in a different arena (z = 1, ring spawn)."
why = "Perfect on its own task, OOB 1.0 on the elevated random-spawn target: a policy only covers the states it was trained on (inferred mechanism)."
evidence = ["artifacts/isaac/lineages/2026-07-17_20-43-59_scratch_flight_bootstrap_v3/"]

[[lesson]]
verdict = "worked"
what = "Correctness audit before scaling (GRU state in eval, balanced episode accounting, exact freezing, executed vs sampled action)."
why = "A memoryless GRU eval alone turned prey OOB 0.012 into 0.955. Evaluation bugs look exactly like learning failures."
evidence = ["UAVPredatorPrey/docs/marl_sota_roadmap.md"]

[[lesson]]
verdict = "failed"
what = "Recipe drift on an uncommitted tree (LR 1e-4/5e-5, AMP, floor −3, short phases)."
why = "Five changes at once and no clean commit: the predator collapsed to 0.098 vs reference prey and no single cause could be isolated afterwards. Since October every run records its commit."
evidence = ["artifacts/isaac/diagnostics/2026-10-04_phase5_role_swap_and_windows_reference/"]

[[lesson]]
verdict = "worked"
what = "Reproduce before improving: return to the archived recipe (FP32, LR 1e-5, floor −2, KL 0.05)."
why = "Restoring the settings reproduced old smokes bit-exactly and made every later comparison meaningful."
evidence = ["artifacts/isaac/diagnostics/2026-10-04_phase5_role_swap_and_windows_reference/"]

[[lesson]]
verdict = "worked"
what = "Rehearsal pool of old opponents (60 %, PFSP floor 0.3) and the `toward_center` scheduler."
why = "Self-play forgets: PFSP drops beaten opponents and the policy then loses to them. Keeping them in the batch is replay against catastrophic forgetting."
evidence = ["artifacts/isaac/experiments/2026-10-07_anchor_v3_overnight/"]

[[lesson]]
verdict = "worked"
what = "Time-limit bootstrapping: a time-out is a truncation, not a termination."
why = "Without it the critic must predict a cliff at a time the observation does not contain; EV collapsed 0.93 → 0.21 at time-outs."
evidence = ["artifacts/isaac/experiments/2026-10-07_time_limit_bootstrap_ab/"]

[[lesson]]
verdict = "worked"
what = "Pre-registered A/Bs with a measured seed noise floor."
why = "SD 0.027 on the own matchup means single-seed gains below ~0.08 are noise; two earlier 'wins' turned out to be held-out losses."
evidence = ["artifacts/isaac/experiments/2026-10-07_training_seed_noise/"]

[[lesson]]
verdict = "worked"
what = "Branch ablation (zero the new pathway's output) before crediting perception."
why = "Crash rates fell in every obstacle run, but only ablation showed whether the pillar observations caused it; most gains were blind."
evidence = ["artifacts/isaac/experiments/2026-10-08_obstacles_first_training/"]

[[lesson]]
verdict = "worked"
what = "Obstacle-branch LR multiplier (× 30) and a soft keep-out band."
why = "A zero-initialized branch at LR 1e-5 barely grew; crashes were too sparse a signal for low-noise policies. The soft band gives a gradient before the crash."
evidence = ["artifacts/isaac/experiments/2026-10-08_obstacles_first_training/"]

[[lesson]]
verdict = "worked"
what = "Crash price plus exploration for the predator."
why = "Works because the predator has no blind shortcut: slowing down costs catches. First perception-based avoidance (+42 % crashes when ablated), kept and sharpened through self-play (ratio 1.41)."
evidence = ["artifacts/isaac/experiments/2026-10-08_obstacles_crash_price_exploration/", "artifacts/isaac/experiments/2026-10-09_overnight_selfplay_ghost_rehearsal/"]

[[lesson]]
verdict = "worked"
what = "Frozen, read-only reference bundles with checksums."
why = "Anchors v2 and v3 and the obstacle predator each reproduce their evaluation bit-exactly from the bundle, so later comparisons always have a fixed opponent."
evidence = ["UAVPredatorPrey/docs/anchor_v3_2026-10-08.md", "UAVPredatorPrey/docs/obstacle_predator_2026-10-10.md"]

[[lesson]]
verdict = "worked"
what = "Crashed-drone masks instead of a placeholder entity."
why = "A crashed predator appeared to the prey as a drone 10 m ahead with zero relative velocity, an input it never trained on. Masking it cut prey exits after a predator crash from 78 % to 1.6 %."
evidence = ["artifacts/isaac/experiments/2026-10-10_crashed_predator_mask_check/"]

[[lesson]]
verdict = "worked"
what = "Probe the trained networks before tuning incentives."
why = "A day of probes found what nine training runs had not: the one-hot pillar attention attends the prey's pillar in 0.4 % of standoffs, and the critic cannot value the long game (EV −0.14)."
evidence = ["artifacts/isaac/diagnostics/2026-10-16_stage8_blind_spots/", "UAVPredatorPrey/docs/stage8_review_2026-10-17.md"]

[[lesson]]
verdict = "worked"
what = "A matched control for every continuation."
why = "The graft's gain appeared only after 9600 extra updates. A control trained just as long without the graft stayed on the plateau (time-outs 0.047, outcome return 112.7), which rules out training time."
evidence = ["artifacts/isaac/experiments/2026-10-18_control_continuation/"]

[[lesson]]
verdict = "worked"
what = "Zero-initialized relation branches: all pillars relative to the drone and the prey."
why = "They broke the waiting game against the frozen prey (time-outs 0.008 vs 0.047, replicated at seed 71) and replaced the one-hot pillar attention. With them zeroed the policy falls below the control, so it really uses them."
evidence = ["artifacts/isaac/experiments/2026-10-18_relation_graft_continuation/", "artifacts/isaac/diagnostics/2026-10-18_c5_branch_ablation/"]

[[lesson]]
verdict = "worked"
what = "Test a gain against a frozen opponent again in self-play."
why = "A frozen prey can be exploited in ways a learning one closes. Here the waiting game stayed broken when the prey trained again (time-outs 0.005), but the game changed: the prey now flees and crashes instead of hiding."
evidence = ["artifacts/isaac/experiments/2026-10-18_relation_graft_selfplay/"]

[[lesson]]
verdict = "partial"
what = "A plain pillar set encoder for the predators, without prey-relative tokens."
why = "It lowered crashes (0.268 → 0.217) and added 10 points, but the waiting game stayed (time-outs 0.033), even with a critic that values the long game. The actor has to see where the prey is relative to the pillars."
evidence = ["artifacts/isaac/experiments/2026-10-19_relation_graft_pillar_only/"]

[[lesson]]
verdict = "partial"
what = "Skill stage against scripted ghosts."
why = "Teaches perception only when evasion is easy (and the pillar-free belt helped); fast ghosts or a pricier crash did not. Suggests an easy → hard curriculum."
evidence = ["artifacts/isaac/experiments/2026-10-09_prey_ghost_skill_stage/"]

[[lesson]]
verdict = "partial"
what = "Slow ghosts in the full layout (v4) as a perception teacher."
why = "Crashes fell (0.272 → 0.174/s) but the ablation ratio stayed marginal (1.24 / 0.93): v1's strong effect also needed the belt. The v5 continuation plateaued at about 1.2."
evidence = ["artifacts/isaac/experiments/2026-10-10_prey_ghost_stage_v4_slow_full_layout/"]

[[lesson]]
verdict = "failed"
what = "Pursuit shaping, a wider exploration floor, and a more agile prey as levers for coordination."
why = "None changes the geometry of free-space 3-D pursuit; the prey can only be cornered against the arena wall. Better individual interception emerged instead."
evidence = ["artifacts/isaac/experiments/2026-10-07_prey_agility_curriculum/"]

[[lesson]]
verdict = "failed"
what = "A higher crash price alone for the prey."
why = "It acts as a speed dial: the prey slows down (blind shortcut) instead of learning to see pillars, and gets caught 2.9 × faster."
evidence = ["artifacts/isaac/experiments/2026-10-08_obstacles_crash_price_exploration/"]

[[lesson]]
verdict = "failed"
what = "Fast-ghost rehearsal to protect the prey's perception in self-play."
why = "The prey lost perception in the first cycle anyway (ratio 1.28 → 0.71): in self-play its incentives favor evasion over safety, even with a crash costing 1.5 × a catch."
evidence = ["artifacts/isaac/experiments/2026-10-09_overnight_selfplay_ghost_rehearsal/"]

[[lesson]]
verdict = "failed"
what = "Parking absent pillars 50 m away instead of masking them."
why = "Far-away pillars are out of distribution for a trained branch: open-space prey OOB 0.90 (zeroed 0.002), predator OOB 0.775. Absent entities need a presence mask."
evidence = ["artifacts/isaac/experiments/2026-10-08_obstacles_first_training/"]

[[lesson]]
verdict = "failed"
what = "JAX port for speed."
why = "Inference parity but closed-loop catch 0.082 vs 0.678: dynamics mismatches compound under feedback. Simulator fidelity has to be validated closed-loop."
evidence = ["UAVPredatorPreyJAX/README.md"]

[[lesson]]
verdict = "failed"
what = "A multi-head attention block grafted onto the trained prey at × 30 LR (v7, v8)."
why = "Its heads found the pillar about to be hit (0.49 vs chance 0.125), but training degraded and the prey switched to 8 m/s flight. The block hurt at both crash costs."
evidence = ["artifacts/isaac/experiments/2026-10-10_prey_ghost_stage_v7_mha/", "artifacts/isaac/experiments/2026-10-10_prey_ghost_stage_v8_block_x_crash_cost/"]

[[lesson]]
verdict = "failed"
what = "Incentive, horizon and noise changes against the waiting prey."
why = "Horizon, shaping, shield starts, a crash-cost curriculum, a forced-crash bonus, role vectors and an exploration boost left the long game unchanged. The predators could not represent the shield, so no incentive could teach it."
evidence = ["artifacts/isaac/experiments/2026-10-14_predator_crash_curriculum/", "artifacts/isaac/experiments/2026-10-16_predator_exploration_boost/"]

[[lesson]]
verdict = "failed"
what = "A smoke run at 256 envs for a new module."
why = "It hid about 5 GB of activations: the full 4096-env run ran out of GPU memory after 1920 updates, and the GPU idled for 2.5 h. Memory smoke runs use the full env count."
evidence = ["artifacts/isaac/experiments/2026-10-17_predator_relation_graft/crashed_run_1/"]

[[lesson]]
verdict = "failed"
what = "Trusting the exit code of an evaluation."
why = "Isaac's scripts exit with 0 even after an exception: three evaluations ran out of GPU memory next to a 26.8 GB training, and only the missing JSONs showed it. Drivers now check the output file, and tight runs evaluate after training."
evidence = ["artifacts/isaac/experiments/2026-10-18_relation_graft_seed71/"]

[[lesson]]
verdict = "failed"
what = "The time-out share alone as the test for the waiting game."
why = "In the symmetric self-play time-outs returned (0.126) while the predators were 1.8 m away and engaged, with the line of sight blocked in 3 % of the time-out frames: a different strategy. A gate should pair an outcome proxy with the mechanism it stands for."
evidence = ["artifacts/isaac/experiments/2026-10-19_symmetric_graft_selfplay/"]

[[lesson]]
verdict = "failed"
what = "Imposed random role vectors for a shared-weight predator team."
why = "The vectors kept their size (norm about 10), but the network learned to ignore them: the drones' lead spread fell from 0.077 to 0.010, and the arm ended level with the control. A team reward under one shared policy pulls the team back to symmetry."
evidence = ["artifacts/isaac/experiments/2026-10-20_dance_coordination_test/"]

[[lesson]]
verdict = "worked"
what = "Re-test a lever after the bottleneck that blocked it is removed."
why = "Discount 0.995 did nothing on 2026-10-12, when the predators could not see the shield. With the relation branches it added 15.5 points over a matched control, mostly by making the predators safer."
evidence = ["artifacts/isaac/experiments/2026-10-20_dance_coordination_test/", "artifacts/isaac/experiments/2026-10-12_predator_stage_gamma995/"]

[[lesson]]
verdict = "worked"
what = "Measure whether a behavior pays before building a lever for it."
why = "The flanking diagnostic (one hour, existing trajectories) showed pincers raise the catch chance only by a third and not at all against a trained-on prey; the separate-heads run then confirmed no specialization. The diagnostic alone had already capped the gain at about 0.03 time-outs."
evidence = ["artifacts/isaac/diagnostics/2026-10-21_flanking_value/"]

[[lesson]]
verdict = "failed"
what = "Separate decision heads per drone with per-drone PPO ratios."
why = "The heads drifted apart in parameters but not in behavior, and each learned from a third of the data, so the arm updated three times less and ended 13 points below the control."
evidence = ["artifacts/isaac/experiments/2026-10-21_drone_heads_test/"]

# =========================================================================================== reproduction recipe

recipe_intro = """
Two tracks, stated honestly. **Track A** (steps 4–12) is exactly reproducible today: each step names the script that
actually ran, its commit, and the number the gate must hit (evaluations are bit-reproducible at fixed seed and env
count). **Track B** (steps 1–3) goes from random init; its flight stages are documented, but the chase stage has
never been run with the archived recipe, so anchor v3 cannot yet be rebuilt from scratch. All commands run inside the
container (`docker start isaac-lab-base-uav51`) from `/workspace/UAVPredatorPrey`, prefixed with
`env -u DISPLAY -u XAUTHORITY /workspace/isaaclab/isaaclab.sh -p`. Check out the listed commit first.

The archived-recipe flags are **not** the preset defaults (the YAML says LR 1e-4, KL 0): always pass
`--learning-rate 1e-5 --kl-threshold 0.05`, and never `--mixed-precision`.
"""

