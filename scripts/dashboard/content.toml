title = "Rehearsal pool and toward_center scheduler → anchor v2"
dates = "2026-10-06"
verdict = "worked"
takeaway = "Keeping old opponents in training undid the forgetting: the self-play analogue of a replay buffer."
metric = "reference mean 0.596 → 0.873"
goal = "Undo the forgetting without losing strength against the current prey."
result = """
- Rehearsal (75 % pool of all 5 reference prey): reference mean 0.596 → 0.828, but own matchup 0.535 → 0.402 (trade-off).
- `toward_center` scheduler (no joint phases; train the role below the band center), 6 × 1200 u: reference mean **0.873** (Windows anchor 0.854). Frozen as anchor v2.
"""
why = "Old opponents must stay in the training distribution; a rehearsal share is the multi-agent analogue of a replay buffer against catastrophic forgetting."
experiment = "2026-10-06_predator_rehearsal_pool"
evidence = ["artifacts/isaac/experiments/2026-10-06_predator_rehearsal_pool/", "UAVPredatorPrey/docs/anchor_v2_2026-10-06.md"]
